<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equinox Map Generator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>Equinox Map Generator</h1></header>
  <div class="app">
    <aside class="panel" aria-label="Tools">
      <section>
        <h2>Tools</h2>
        <div class="tool-palette" role="group" aria-label="Tool palette">
          <button type="button" data-tool="select" aria-pressed="true">Select</button>
          <button type="button" data-tool="room" aria-pressed="false">Room</button>
          <button type="button" data-tool="complex" aria-pressed="false">Complex room</button>
          <button type="button" data-tool="poi" aria-pressed="false">Point</button>
          <button type="button" data-tool="door" aria-pressed="false">Door</button>
          <button type="button" data-tool="pan" aria-pressed="false">Pan</button>
        </div>
        <p id="map-help"></p>
        <div id="shape-options" class="options" hidden>
          <button id="finish-shape" type="button" disabled>Finish shape</button>
          <button id="cancel-shape" type="button" disabled>Cancel shape</button>
        </div>
        <div id="poi-options" class="options" hidden>
          <label for="poi-type">Point type</label>
          <select id="poi-type">
            <option value="weapon">Weapon (W)</option>
            <option value="orb">Orb (O)</option>
            <option value="apple">Apple (A)</option>
            <option value="potion">Potion (P)</option>
            <option value="boss">Boss (B)</option>
            <option value="key">Key (K)</option>
            <option value="ladder">Ladder (L)</option>
          </select>
          <label for="poi-color">Colour</label>
          <select id="poi-color"></select>
        </div>
        <div id="door-options" class="options" hidden>
          <label for="door-color">Door colour</label>
          <select id="door-color"></select>
        </div>
        <p id="rainbow-door-note" hidden></p>
        <button id="delete-selected" type="button" disabled>Delete selected</button>
      </section>
      <section class="map-controls">
        <h2>Map</h2>
        <label for="map-name">Map name</label>
        <input id="map-name" type="text" maxlength="100" placeholder="Name this map">
        <button id="save-map" type="button">Save map</button>
        <label for="map-list">Available maps</label>
        <select id="map-list" disabled>
          <option value="">No maps available</option>
        </select>
        <button id="load-map" type="button" disabled>Load selected map</button>
        <p id="map-status" role="status" aria-live="polite"></p>
      </section>
    </aside>
    <main>
      <div id="map-viewport"><canvas id="map" width="3840" height="2560" aria-describedby="map-help"></canvas></div>
    </main>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
